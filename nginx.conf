server {
    listen 80;
    server_name _;
    root /app/public;
    index index.html;

    # 靜態網頁
    location / {
        try_files $uri $uri/ =404;
    }

    # data.json 不快取，確保每次看到最新資料
    location = /data.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # 健康檢查端點
    location = /health {
        return 200 "OK";
        add_header Content-Type text/plain;
    }
}
