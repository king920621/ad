<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WS 卡片價格表</title>
<style>
  body {
    font-family: -apple-system, "Microsoft JhengHei", "Noto Sans CJK TC", sans-serif;
    background: #ffffff;
    margin: 0;
    padding: 40px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    color: #000;
  }
  
  /* 每個區塊的容器 */
  .section {
    width: 100%;
    max-width: 1400px;
    margin-bottom: 60px; /* 區塊之間的間距 */
  }

  /* 標題樣式 */
  .section-title {
    font-size: 48px;
    font-weight: 900;
    margin: 0 0 20px 0;
    text-align: center;
    letter-spacing: 2px;
    color: #000;
  }

  table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0 4px;
  }

  th {
    background-color: #a4b3ea;
    color: #000;
    font-weight: bold;
    font-size: 18px;
    padding: 18px 10px;
    text-align: center;
    border: none;
    white-space: nowrap;
  }

  td {
    background-color: #e2e7fb;
    padding: 18px 10px;
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    color: #000;
    border: none;
  }

  th:nth-child(1), td:nth-child(1) { width: 20%; }
  th:nth-child(2), td:nth-child(2) { width: 20%; }
  th:nth-child(3), td:nth-child(3) { width: 40%; }
  th:nth-child(4), td:nth-child(4) { width: 15%; }
  th:nth-child(5), td:nth-child(5) { width: 5%; }

  #error-msg {
    color: #c0392b;
    font-size: 16px;
    margin-top: 20px;
    display: none;
  }
</style>
</head>
<body>

  <!-- 所有區塊會動態生成到這裡 -->
  <div id="content-container" style="width: 100%; max-width: 1400px;">
    <div style="text-align:center; font-size:24px;">載入中...</div>
  </div>

  <div id="error-msg">無法讀取 data.json，請確認檔案是否存在。</div>

<script>
// 渲染單一表格的輔助函式
function renderTable(cards) {
  if (!cards || cards.length === 0) {
    return '<div style="text-align:center; padding:20px; color:#888;">目前沒有卡片資料</div>';
  }
  
  const rows = cards.map(card => `
    <tr>
      <td>${card.series || ''}</td>
      <td>${card.id || ''}</td>
      <td>${card.name || ''}</td>
      <td>${card.price != null ? card.price + ' 円' : ''}</td>
      <td>${card.rarity || ''}</td>
    </tr>
  `).join('');

  return `
    <table>
      <thead>
        <tr>
          <th>作品</th>
          <th>卡號</th>
          <th>卡名</th>
          <th>卡價</th>
          <th>版本</th>
        </tr>
      </thead>
      <tbody>
        ${rows}
      </tbody>
    </table>
  `;
}

async function loadData() {
  try {
    const res = await fetch('data.json?t=' + Date.now());
    const data = await res.json();
    
    const container = document.getElementById('content-container');
    container.innerHTML = ''; // 清空載入中提示

    // 遍歷 sections，為每個 section 生成標題和表格
    if (data.sections && Array.isArray(data.sections)) {
      data.sections.forEach(section => {
        const sectionDiv = document.createElement('div');
        sectionDiv.className = 'section';
        
        // 生成標題
        const titleEl = document.createElement('h1');
        titleEl.className = 'section-title';
        titleEl.textContent = section.title || '未命名區塊';
        
        // 生成表格
        const tableHtml = renderTable(section.cards);
        
        sectionDiv.appendChild(titleEl);
        sectionDiv.insertAdjacentHTML('beforeend', tableHtml);
        container.appendChild(sectionDiv);
      });
    } else {
      // 向下相容舊格式
      const titleEl = document.createElement('h1');
      titleEl.className = 'section-title';
      titleEl.textContent = data.title || '卡片價格表';
      const tableHtml = renderTable(data.cards);
      container.appendChild(titleEl);
      container.insertAdjacentHTML('beforeend', tableHtml);
    }

  } catch (error) {
    console.error('讀取資料失敗:', error);
    document.getElementById('content-container').innerHTML = '';
    document.getElementById('error-msg').style.display = 'block';
  }
}

loadData();
</script>

</body>
</html>
